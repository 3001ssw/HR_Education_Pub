<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한글 내 이름 쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #222;
    --trace: #c3c8cf;
    --line: #8fa3b8;
    --guide: #dfe5ec;
    --accent: #e8618c;
    --soft: #fdf3f6;
    --bg: #e9ecef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  /* ---------- 화면용 도구 막대 ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #ccd;
    font-size: 14px;
  }
  .toolbar button {
    font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 8px;
    border: 0; background: var(--accent); color: #fff; cursor: pointer;
  }
  .toolbar .tip { color: #667; }

  /* ---------- A4 한 장 ---------- */
  @page { size: A4; margin: 0; }
  .page {
    width: 210mm; height: 297mm;
    margin: 16px auto; padding: 12mm 13mm 10mm;
    background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .page { margin: 0; box-shadow: none; break-after: page; zoom: 1 !important; }
    .page:last-child { break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  .head {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--accent); padding-bottom: 3mm; margin-bottom: 4mm;
  }
  .head h1 { margin: 0; font-size: 22pt; line-height: 1.1; }
  .head h1 small { display: block; font-size: 10.5pt; font-weight: 400; color: #556; margin-top: 1.5mm; }
  .head .who { font-size: 11pt; color: #334; text-align: right; white-space: nowrap; }
  .head .who span { display: inline-block; min-width: 24mm; border-bottom: 1px solid #99a; margin-left: 1mm; }
  .stars { font-size: 16pt; letter-spacing: 1mm; color: #f2c230; }
  .foot { margin-top: auto; font-size: 9.5pt; color: #667; text-align: center; padding-top: 2mm; }

  /* ---------- 글자 칸 ---------- */
  .rows { display: flex; flex-direction: column; gap: var(--rowgap, 4mm); }
  .row { display: flex; flex-direction: column; gap: 1.2mm; }
  .cap { font-size: 10.5pt; color: #445; }
  .cap b { color: var(--accent); font-size: 12pt; margin-right: 1.5mm; }
  .cells { display: flex; gap: 2mm; align-items: center; }
  .cell {
    width: var(--cell); height: var(--cell); flex: none;
    border: 1.3px solid var(--line); border-radius: 1.5mm; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * 0.72); line-height: 1;
  }
  .cell::before, .cell::after { content: ""; position: absolute; pointer-events: none; }
  .cell::before { left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--guide); }
  .cell::after  { top: 50%; left: 0; right: 0; border-top: 1px dashed var(--guide); }
  .cell span { position: relative; z-index: 1; }
  .cell.model { border-color: var(--accent); background: var(--soft); }
  .cell.model span { color: var(--ink); font-weight: 700; }
  .cell.trace span { color: var(--trace); }
  .cell.pic {
    border-style: dashed; border-color: #c9d2dc; flex-direction: column; gap: 0.5mm;
    font-size: calc(var(--cell) * 0.42);
  }
  .cell.pic::before, .cell.pic::after { display: none; }
  .cell.pic small { font-size: 9pt; color: #445; font-weight: 700; }
  .wordgap { width: 1mm; flex: none; }

  /* ---------- 선 긋기 ---------- */
  .lines { display: flex; flex-direction: column; gap: 2mm; }
  .lines .cap { margin-bottom: 0.5mm; }
  .lines svg { width: 100%; height: 22mm; display: block; }

  /* ---------- 이름 ---------- */
  .bigname { display: flex; gap: 8mm; justify-content: center; margin: 1mm 0 5mm; }
  .bigname .one { display: flex; flex-direction: column; align-items: center; gap: 2mm; }
  .bigname .cap { max-width: 70mm; text-align: center; }

  /* ---------- 안내 / 체크표 ---------- */
  .guide h2 { font-size: 14pt; margin: 4mm 0 2mm; color: var(--accent); }
  .guide ol, .guide ul { margin: 0; padding-left: 6mm; font-size: 11pt; line-height: 1.75; }
  .check { width: 100%; border-collapse: collapse; font-size: 11pt; margin-top: 1mm; }
  .check th, .check td { border: 1px solid #b8c2cc; height: 10.5mm; padding: 0 2mm; }
  .check th { background: var(--soft); height: 8mm; }
  .check td.num { text-align: center; color: #556; width: 10mm; }
</style>
</head>
<body>

<div class="toolbar">
  <button type="button" onclick="window.print()">🖨️ 인쇄하기</button>
  <span class="tip">A4 · 여백 없음(또는 기본) · 배율 100%로 인쇄하세요. 원하는 장만 골라 인쇄해도 됩니다.</span>
</div>

<main id="book"></main>

<script>
/* ---------- 칸 만들기 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cell = (t, kind) => `<div class="cell ${kind || ''}"><span>${t ? esc(t) : ''}</span></div>`;

function page(title, sub, body, foot, opts = {}) {
  const who = opts.noName ? '' :
    `<div class="who">날짜 <span></span><br><span class="stars">☆☆☆</span></div>`;
  return `<section class="page" style="--cell:${opts.cell || '28mm'};--rowgap:${opts.rowgap || '4mm'}">
    <div class="head"><h1>${title}<small>${sub}</small></h1>${who}</div>
    ${body}
    <div class="foot">${foot || '칸에서 삐져나가도 괜찮아요. 끝까지 해 보면 ⭐ 하나!'}</div>
  </section>`;
}

/* 한 글자 줄: 본보기 1 + 따라쓰기 3 + 빈칸 2 */
function letterRow(ch, cap, n = 6, trace = 3) {
  let c = cell(ch, 'model');
  for (let i = 0; i < trace; i++) c += cell(ch, 'trace');
  for (let i = 1 + trace; i < n; i++) c += cell('');
  return `<div class="row"><div class="cap"><b>${esc(ch)}</b>${cap}</div><div class="cells">${c}</div></div>`;
}

/* 낱말 줄: 그림칸 + (낱말 따라쓰기 … 빈칸) 6칸 */
function wordRow(word, emoji, slots = 6) {
  const chars = [...word];
  const copies = Math.max(1, Math.floor(slots / chars.length));
  const trace = Math.ceil(copies / 2);
  let c = `<div class="cell pic">${emoji}<small>${esc(word)}</small></div><div class="wordgap"></div>`;
  for (let k = 0; k < copies; k++) {
    chars.forEach(ch => c += cell(k < trace ? ch : '', k < trace ? 'trace' : ''));
    if (k < copies - 1 && chars.length > 1) c += '<div class="wordgap"></div>';
  }
  return `<div class="row"><div class="cells">${c}</div></div>`;
}

/* ---------- 선 긋기 (SVG) ---------- */
const W = 184, H = 25;          // mm 단위 viewBox
const dash = 'stroke="#aab3bd" stroke-width="0.9" stroke-dasharray="2.2 1.8" fill="none" stroke-linecap="round"';
const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="1.6" fill="#3bb273"/>`;
function svg(inner) { return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`; }
function series(n, fn) { let s = ''; const step = (W - 8) / n; for (let i = 0; i < n; i++) s += fn(6 + i * step + step / 2 - 5, i); return s; }

const linePatterns = [
  ['🚂', '기차가 칙칙폭폭 옆으로 가요 (─)', () => [4, 12.5, 21].map(y => dot(6, y) + `<path d="M6 ${y} H178" ${dash}/>`).join('')],
  ['🌧️', '비가 주룩주룩 아래로 내려요 (│)', () => series(14, x => dot(x + 5, 3) + `<path d="M${x + 5} 3 V22" ${dash}/>`)],
  ['🛝', '미끄럼틀을 슝~ 내려가요 (╲)', () => series(10, x => dot(x, 3) + `<path d="M${x} 3 L${x + 11} 22" ${dash}/>`)],
  ['🪁', '연이 하늘로 올라가요 (╱)', () => series(10, x => dot(x, 22) + `<path d="M${x} 22 L${x + 11} 3" ${dash}/>`)],
  ['⛰️', '산을 넘어 넘어 (ㅅ 모양)', () => { let d = 'M6 22'; for (let x = 6; x < 176; x += 17) d += ` L${x + 8.5} 3 L${x + 17} 22`; return dot(6, 22) + `<path d="${d}" ${dash}/>`; }],
  ['🌊', '파도가 출렁출렁', () => { let d = 'M6 12.5'; for (let x = 6; x < 166; x += 20) d += ` q5 -10 10 0 t10 0`; return dot(6, 12.5) + `<path d="${d}" ${dash}/>`; }],
  ['🫧', '비눗방울이 동글동글 (○)', () => series(9, x => dot(x + 5, 3.5) + `<circle cx="${x + 5}" cy="12.5" r="9" ${dash}/>`)],
  ['➕', '가로 한 번, 세로 한 번 (＋)', () => series(9, x => dot(x - 3, 12.5) + dot(x + 5, 3.5) + `<path d="M${x - 3} 12.5 H${x + 13} M${x + 5} 3.5 V21.5" ${dash}/>`)],
];

/* ---------- 내용 ---------- */
const vowels = [
  ['ㅏ', '아 — 기둥 │ 쭉 → 오른쪽으로 짧게 ─'],
  ['ㅓ', '어 — 왼쪽에 짧게 ─ → 기둥 │ 쭉'],
  ['ㅗ', '오 — 위에서 짧게 │ → 바닥에 길게 ──'],
  ['ㅜ', '우 — 길게 ── → 가운데서 아래로 짧게 │'],
  ['ㅡ', '으 — 왼쪽에서 오른쪽으로 ──'],
  ['ㅣ', '이 — 위에서 아래로 │'],
];
const consonants = [
  ['ㄱ', '기역 — 옆으로 ─ 갔다가 아래로 꺾어요 (한 번에)'],
  ['ㄴ', '니은 — 아래로 │ 내려와서 옆으로 꺾어요 (한 번에)'],
  ['ㄷ', '디귿 — 위에 ─ → 아래로 내려와 꺾어 └─'],
  ['ㄹ', '리을 — ─┐ → 가운데 ─ → 아래로 내려와 └─'],
  ['ㅁ', '미음 — 왼쪽 │ → 위에서 꺾어 ┐ → 바닥 ─'],
  ['ㅅ', '시옷 — 왼쪽으로 ╱ → 가운데서 오른쪽으로 ╲'],
  ['ㅇ', '이응 — 위에서 시작해 왼쪽으로 동그랗게 ○'],
];
const syllables = [
  ['가', 'ㄱ + ㅏ'], ['나', 'ㄴ + ㅏ'], ['다', 'ㄷ + ㅏ'], ['라', 'ㄹ + ㅏ'],
  ['마', 'ㅁ + ㅏ'], ['사', 'ㅅ + ㅏ'], ['아', 'ㅇ + ㅏ'], ['하', 'ㅎ + ㅏ'],
];
const easyWords = [['나무','🌳'],['우유','🥛'],['오이','🥒'],['하마','🦛'],['사자','🦁'],['고기','🍖'],['아기','👶'],['나비','🦋']];
const hardWords = [['엄마','👩'],['아빠','👨'],['사랑','❤️'],['사과','🍎'],['곰','🐻'],['강아지','🐶']];

const pages = [];

/* 0. 부모님 안내 + 체크표 */
pages.push(page('한글 따라쓰기', '부모님 안내 · 체크표 (이 장은 한 번만 인쇄)', `
  <div class="guide">
    <h2>이렇게 해요</h2>
    <ol>
      <li>하루 <b>1장, 10분 안쪽</b>으로만. 지루해하면 바로 멈춰요.</li>
      <li>분홍 칸의 큰 글자를 <b>손가락으로 먼저</b> 따라 그려요 (공중에 쓰기, 등에 써 주기도 좋아요).</li>
      <li>획순을 말로 같이 해요: "위에서 쭉~ 아래로 쭉!" — <b>위 → 아래, 왼쪽 → 오른쪽</b></li>
      <li>회색 글자를 따라 쓰고, 빈칸에는 혼자 써 봐요. 삐져나가도 <b>칭찬부터</b>.</li>
      <li>다 하면 오른쪽 위 ☆ 에 색칠하거나 스티커를 붙여요.</li>
    </ol>
    <h2>순서</h2>
    <ul>
      <li>① 선 긋기 → ② 내 이름 → ③ 모음 → ④ 자음 → ⑤ 글자 만들기(2장) → ⑥ 쉬운 낱말 → ⑦ 받침 낱말</li>
      <li>같은 장을 여러 번 인쇄해서 반복해도 좋아요. 인쇄할 때 <b>배율 100%</b>로 해 주세요.</li>
    </ul>
    <h2>체크표</h2>
    <table class="check">
      <tr><th style="width:10mm">#</th><th style="width:30mm">날짜</th><th>한 장</th><th style="width:22mm">⭐</th><th>한마디</th></tr>
      ${Array.from({length: 10}, (_, i) => `<tr><td class="num">${i + 1}</td><td></td><td></td><td></td><td></td></tr>`).join('')}
    </table>
    <h2>부모님 메모</h2>
    <ul>
      <li>굵은 삼각 연필·색연필이 쥐기 쉬워요. 처음엔 크레용·사인펜도 좋아요.</li>
      <li>손가락으로 모래·밀가루·쉐이빙폼 위에 써 보기, 간판·과자 봉지에서 <b>아는 글자 찾기</b>도 효과적이에요.</li>
    </ul>
  </div>`, '한글 놀이 학습지', { noName: true }));

/* 1. 선 긋기 */
pages.push(page('① 선 긋기', '초록 점에서 시작해서 점선을 따라 그어요', `
  <div class="lines">${linePatterns.map(([e, t, f]) =>
    `<div><div class="cap"><b>${e}</b>${t}</div>${svg(f())}</div>`).join('')}
  </div>`, '이야기를 하면서 그어요: "기차가 칙칙폭폭~"'));

/* 2. 이름 */
pages.push(page('② 내 이름 쓰기', '부모님이 분홍 칸에 아이 이름을 크게 써 주세요 (연한 색 펜이면 따라 쓰기 좋아요)', `
  <div class="bigname">${cell('', 'model')}${cell('', 'model')}${cell('', 'model')}</div>
  <div class="rows" style="--cell:27mm;--rowgap:4mm">
    ${[0, 0, 0, 0, 0].map(() => `<div class="row"><div class="cells" style="--cell:27mm">${Array.from({length: 6}, () => cell('')).join('')}</div></div>`).join('')}
  </div>`, '가방·그림에도 이름을 써 봐요', { cell: '48mm' }));

/* 3. 모음 */
pages.push(page('③ 모음 — 기둥 글자', '아 · 어 · 오 · 우 · 으 · 이 노래처럼 부르며 써요',
  `<div class="rows">${vowels.map(([c, t]) => letterRow(c, t)).join('')}</div>`,
  undefined, { cell: '29mm', rowgap: '3.2mm' }));

/* 4. 자음 */
pages.push(page('④ 자음 — 기본 글자', '기역 · 니은 · 디귿… 이름을 말하며 써요',
  `<div class="rows">${consonants.map(([c, t]) => letterRow(c, t)).join('')}</div>`,
  undefined, { cell: '26mm', rowgap: '2.6mm' }));

/* 5. 글자 만들기 (2장) */
[[0, 4, '가 · 나 · 다 · 라'], [4, 8, '마 · 사 · 아 · 하']].forEach(([a, b, s], i) =>
  pages.push(page(`⑤ 글자 만들기 ${i + 1}`, `자음 + ㅏ = ${s}  — "가나다라마바사~" 노래로 불러요`,
    `<div class="rows">${syllables.slice(a, b).map(([c, t]) => letterRow(c, t, 5, 2)).join('')}</div>`,
    undefined, { cell: '34mm', rowgap: '6mm' })));

/* 6. 쉬운 낱말 */
pages.push(page('⑥ 쉬운 낱말', '받침 없는 낱말이에요. 다 쓰면 그림도 그려 봐요',
  `<div class="rows">${easyWords.map(([w, e]) => wordRow(w, e)).join('')}</div>`,
  '동물 흉내를 내며 써 보세요: "하마가 하품해요~"', { cell: '23mm', rowgap: '5.5mm' }));

/* 7. 받침 낱말 */
pages.push(page('⑦ 받침 있는 낱말 (도전!)', '아래에 받침이 붙은 글자예요',
  `<div class="rows">${hardWords.map(([w, e]) => wordRow(w, e)).join('')}
    <div class="row"><div class="cap"><b>✏️</b>내가 쓰고 싶은 낱말</div><div class="cells">${Array.from({length: 7}, () => cell('')).join('')}</div></div>
    <div class="row"><div class="cells">${Array.from({length: 7}, () => cell('')).join('')}</div></div>
  </div>`, '엄마·아빠 이름도 같이 써 봐요', { cell: '23mm', rowgap: '5mm' }));

const SHOW = [2];   // 이 파일에서 보여 줄 장
document.getElementById('book').innerHTML = pages.filter((_, i) => SHOW.includes(i)).join('');

/* 화면이 좁으면(휴대폰) 장 전체가 보이게 축소 — 인쇄에는 영향 없음 */
function fit() {
  const mm = 96 / 25.4, full = 210 * mm + 32;
  const z = Math.min(1, window.innerWidth / full);
  document.querySelectorAll('.page').forEach(p => p.style.zoom = z);
}
fit(); window.addEventListener('resize', fit);
</script>
</body>
</html>
