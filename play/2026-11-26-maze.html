<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #222;
    --trace: #c3c8cf;
    --line: #8fa3b8;
    --guide: #dfe5ec;
    --accent: #e8618c;
    --soft: #fdf3f6;
    --bg: #e9ecef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  /* ---------- 화면용 도구 막대 ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #ccd;
    font-size: 14px;
  }
  .toolbar button {
    font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 8px;
    border: 0; background: var(--accent); color: #fff; cursor: pointer;
  }
  .toolbar .tip { color: #667; }

  /* ---------- A4 한 장 ---------- */
  @page { size: A4; margin: 0; }
  .page {
    width: 210mm; height: 297mm;
    margin: 16px auto; padding: 12mm 13mm 10mm;
    background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .page { margin: 0; box-shadow: none; break-after: page; zoom: 1 !important; }
    .page:last-child { break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  .head {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--accent); padding-bottom: 3mm; margin-bottom: 4mm;
  }
  .head h1 { margin: 0; font-size: 22pt; line-height: 1.1; }
  .head h1 small { display: block; font-size: 10.5pt; font-weight: 400; color: #556; margin-top: 1.5mm; }
  .head .who { font-size: 11pt; color: #334; text-align: right; white-space: nowrap; }
  .head .who span { display: inline-block; min-width: 24mm; border-bottom: 1px solid #99a; margin-left: 1mm; }
  .stars { font-size: 16pt; letter-spacing: 1mm; color: #f2c230; }
  .foot { margin-top: auto; font-size: 9.5pt; color: #667; text-align: center; padding-top: 2mm; }

  /* ---------- 글자 칸 ---------- */
  .rows { display: flex; flex-direction: column; gap: var(--rowgap, 4mm); }
  .row { display: flex; flex-direction: column; gap: 1.2mm; }
  .cap { font-size: 10.5pt; color: #445; }
  .cap b { color: var(--accent); font-size: 12pt; margin-right: 1.5mm; }
  .cells { display: flex; gap: 2mm; align-items: center; }
  .cell {
    width: var(--cell); height: var(--cell); flex: none;
    border: 1.3px solid var(--line); border-radius: 1.5mm; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * 0.72); line-height: 1;
  }
  .cell::before, .cell::after { content: ""; position: absolute; pointer-events: none; }
  .cell::before { left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--guide); }
  .cell::after  { top: 50%; left: 0; right: 0; border-top: 1px dashed var(--guide); }
  .cell span { position: relative; z-index: 1; }
  .cell.model { border-color: var(--accent); background: var(--soft); }
  .cell.model span { color: var(--ink); font-weight: 700; }
  .cell.trace span { color: var(--trace); }
  .cell.pic {
    border-style: dashed; border-color: #c9d2dc; flex-direction: column; gap: 0.5mm;
    font-size: calc(var(--cell) * 0.42);
  }
  .cell.pic::before, .cell.pic::after { display: none; }
  .cell.pic small { font-size: 9pt; color: #445; font-weight: 700; }
  .wordgap { width: 1mm; flex: none; }

  /* ---------- 선 긋기 ---------- */
  .lines { display: flex; flex-direction: column; gap: 2mm; }
  .lines .cap { margin-bottom: 0.5mm; }
  .lines svg { width: 100%; height: 22mm; display: block; }

  /* ---------- 이름 ---------- */
  .bigname { display: flex; gap: 8mm; justify-content: center; margin: 1mm 0 5mm; }
  .bigname .one { display: flex; flex-direction: column; align-items: center; gap: 2mm; }
  .bigname .cap { max-width: 70mm; text-align: center; }

  /* ---------- 안내 / 체크표 ---------- */
  .guide h2 { font-size: 14pt; margin: 4mm 0 2mm; color: var(--accent); }
  .guide ol, .guide ul { margin: 0; padding-left: 6mm; font-size: 11pt; line-height: 1.75; }
  .check { width: 100%; border-collapse: collapse; font-size: 11pt; margin-top: 1mm; }
  .check th, .check td { border: 1px solid #b8c2cc; height: 10.5mm; padding: 0 2mm; }
  .check th { background: var(--soft); height: 8mm; }
  .check td.num { text-align: center; color: #556; width: 10mm; }

  /* ---------- 수학·영어·놀이 공통 ---------- */
  .emo { font-size: calc(var(--cell) * 0.62); }
  .cell.emo::before, .cell.emo::after { display: none; }
  .cell.emo.model { background: var(--soft); }
  .cell.choice { width: 18mm; height: 18mm; border-style: dashed; font-size: 11mm; }
  .cell.choice::before, .cell.choice::after { display: none; }
  .op { font-size: 20pt; font-weight: 700; color: #556; flex: none; width: 8mm; text-align: center; }
  .box {
    border: 1.3px dashed #b9c4cf; border-radius: 2mm; display: flex; flex-wrap: wrap;
    align-content: center; justify-content: center; gap: 1mm 2mm; padding: 1.5mm;
    font-size: 22pt; line-height: 1.1; height: var(--cell); flex: none;
  }
  .box .n { width: 100%; text-align: center; font-size: 10pt; color: #667; }
  .note { font-size: 10.5pt; color: #445; margin: -1mm 0 3mm; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; flex: 1; min-height: 0; }
  .grid2 > div { display: flex; flex-direction: column; align-items: center; gap: 1mm; border: 1px solid #e3e8ee; border-radius: 2mm; padding: 2mm; min-height: 0; }
  .grid2 svg { width: 100%; flex: 1; min-height: 0; }
  .bigsvg { width: 100%; flex: 1; min-height: 0; display: block; }
</style>
</head>
<body>

<div class="toolbar">
  <button type="button" onclick="window.print()">🖨️ 인쇄하기</button>
  <span class="tip">A4 · 여백 없음(또는 기본) · 배율 100%로 인쇄하세요. 원하는 장만 골라 인쇄해도 됩니다.</span>
</div>

<main id="book"></main>

<script>
/* ---------- 칸 만들기 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cell = (t, kind) => `<div class="cell ${kind || ''}"><span>${t ? esc(t) : ''}</span></div>`;

function page(title, sub, body, foot, opts = {}) {
  const who = opts.noName ? '' :
    `<div class="who">날짜 <span></span><br><span class="stars">☆☆☆</span></div>`;
  return `<section class="page" style="--cell:${opts.cell || '28mm'};--rowgap:${opts.rowgap || '4mm'}">
    <div class="head"><h1>${title}<small>${sub}</small></h1>${who}</div>
    ${body}
    <div class="foot">${foot || '칸에서 삐져나가도 괜찮아요. 끝까지 해 보면 ⭐ 하나!'}</div>
  </section>`;
}

/* 한 글자 줄: 본보기 1 + 따라쓰기 3 + 빈칸 2 */
function letterRow(ch, cap, n = 6, trace = 3) {
  let c = cell(ch, 'model');
  for (let i = 0; i < trace; i++) c += cell(ch, 'trace');
  for (let i = 1 + trace; i < n; i++) c += cell('');
  return `<div class="row"><div class="cap"><b>${esc(ch)}</b>${cap}</div><div class="cells">${c}</div></div>`;
}

/* 낱말 줄: 그림칸 + (낱말 따라쓰기 … 빈칸) 6칸 */
function wordRow(word, emoji, slots = 6) {
  const chars = [...word];
  const copies = Math.max(1, Math.floor(slots / chars.length));
  const trace = Math.ceil(copies / 2);
  let c = `<div class="cell pic">${emoji}<small>${esc(word)}</small></div><div class="wordgap"></div>`;
  for (let k = 0; k < copies; k++) {
    chars.forEach(ch => c += cell(k < trace ? ch : '', k < trace ? 'trace' : ''));
    if (k < copies - 1 && chars.length > 1) c += '<div class="wordgap"></div>';
  }
  return `<div class="row"><div class="cells">${c}</div></div>`;
}


const pages = [];
const blank = n => Array.from({length: n}, () => cell('')).join('');
const emoCell = (e, kind = '') => `<div class="cell emo ${kind}"><span>${e}</span></div>`;

/* 부모님 안내 + 체크표 */
function guidePage(title, steps, order) {
  return page(title, '부모님 안내 · 체크표 (이 장은 한 번만 인쇄)', `
  <div class="guide">
    <h2>이렇게 해요</h2>
    <ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <h2>순서</h2>
    <ul><li>${order}</li>
      <li>같은 장을 여러 번 인쇄해서 반복해도 좋아요. 인쇄할 때 <b>배율 100%</b>로 해 주세요.</li></ul>
    <h2>체크표</h2>
    <table class="check">
      <tr><th style="width:10mm">#</th><th style="width:30mm">날짜</th><th>한 장</th><th style="width:22mm">⭐</th><th>한마디</th></tr>
      ${Array.from({length: 12}, (_, i) => `<tr><td class="num">${i + 1}</td><td></td><td></td><td></td><td></td></tr>`).join('')}
    </table>
  </div>`, '', { noName: true });
}

/* 간단한 난수 (인쇄할 때마다 같은 모양이 나오게 씨앗 고정) */
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }



/* 미로 만들기: 깊이 우선 탐색, 씨앗 고정 */
function maze(cols, rows, seed, start, goal) {
  const R = rng(seed), seen = new Set(), right = new Set(), down = new Set();
  const stack = [[0, 0]]; seen.add('0,0');
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy])
      .filter(([a, b]) => a >= 0 && b >= 0 && a < cols && b < rows && !seen.has(a + ',' + b));
    if (!nb.length) { stack.pop(); continue; }
    const [a, b] = nb[Math.floor(R() * nb.length)];
    if (a !== x) right.add(Math.min(a, x) + ',' + y); else down.add(x + ',' + Math.min(b, y));
    seen.add(a + ',' + b); stack.push([a, b]);
  }
  const c = 10, w = cols * c, h = rows * c, st = 'stroke="#334" stroke-width="1.1" stroke-linecap="round"';
  let s = `<rect x="0" y="0" width="${w}" height="${h}" fill="#fff"/>`;
  s += `<path d="M${c} 0 H${w} V${h} M${w - c} ${h} H0 V0" fill="none" ${st}/>`;   // 바깥 벽 (입구·출구 열림)
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (x < cols - 1 && !right.has(x + ',' + y)) s += `<path d="M${(x + 1) * c} ${y * c} V${(y + 1) * c}" ${st}/>`;
    if (y < rows - 1 && !down.has(x + ',' + y)) s += `<path d="M${x * c} ${(y + 1) * c} H${(x + 1) * c}" ${st}/>`;
  }
  s += `<text x="${c / 2}" y="${c * 0.72}" font-size="${c * 0.62}" text-anchor="middle">${start}</text>`;
  s += `<text x="${w - c / 2}" y="${h - c * 0.28}" font-size="${c * 0.62}" text-anchor="middle">${goal}</text>`;
  return `<svg class="bigsvg" viewBox="-2 -2 ${w + 4} ${h + 4}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}
pages.push(page('① 미로 1', '🐰 토끼가 🥕 당근을 먹으러 가요. 길을 따라 선을 그어요', maze(6, 8, 7, '🐰', '🥕'), '손가락으로 먼저 길을 찾아 봐요'));
pages.push(page('① 미로 2', '🐶 강아지가 🦴 뼈다귀를 찾아가요. 조금 더 어려워요!', maze(9, 12, 42, '🐶', '🦴'), '막히면 돌아 나와서 다른 길로 가 봐요'));

document.getElementById('book').innerHTML = pages.join('');

/* 화면이 좁으면(휴대폰) 장 전체가 보이게 축소 — 인쇄에는 영향 없음 */
function fit() {
  const mm = 96 / 25.4, full = 210 * mm + 32;
  const z = Math.min(1, window.innerWidth / full);
  document.querySelectorAll('.page').forEach(p => p.style.zoom = z);
}
fit(); window.addEventListener('resize', fit);
</script>
</body>
</html>
